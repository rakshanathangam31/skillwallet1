<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ComicCraft - AI Comic Creator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans',sans-serif; }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at top left, #1e1b4b, #0f172a);
      display: flex; align-items: center; justify-content: center;
      padding: 2rem; color: #f8fafc;
    }
    .card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 2.5rem; border-radius: 24px;
      max-width: 600px; width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    }
    h1 { font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem; background: linear-gradient(to right, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    p.subtitle { color: #94a3b8; margin-bottom: 2rem; font-size: 0.95rem; }
    .form-group { margin-bottom: 1.25rem; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; color: #cbd5e1; text-transform: uppercase; letter-spacing: 0.05em; }
    input, select, textarea {
      width: 100%; padding: 0.85rem 1.2rem; background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px;
      color: #fff; font-size: 0.95rem; outline: none; transition: all 0.2s;
    }
    input:focus, select:focus, textarea:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.2); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    button {
      width: 100%; padding: 1rem; margin-top: 1rem;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white; border: none; border-radius: 14px;
      font-weight: 700; font-size: 1rem; cursor: pointer;
      box-shadow: 0 10px 20px -5px rgba(79,70,229,0.5);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 15px 25px -5px rgba(79,70,229,0.7); }
    .loader { display: none; text-align: center; margin-top: 1rem; color: #a5b4fc; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <h1>ComicCraft AI</h1>
    <p class="subtitle">Turn your creative story ideas into dynamic comic strips with Gemini & AI Art</p>
    <form action="/generate" method="POST" onsubmit="document.getElementById('loader').style.display='block';">
      <div class="form-group">
        <label>Story Prompt</label>
        <textarea name="prompt" rows="3" placeholder="A brave red fox exploring an enchanted neon forest..." required></textarea>
      </div>
      <div class="grid">
        <div class="form-group">
          <label>Character Name</label>
          <input type="text" name="character_name" placeholder="E.g., Leo" required>
        </div>
        <div class="form-group">
          <label>Setting</label>
          <select name="setting">
            <option value="Enchanted Forest">Enchanted Forest</option>
            <option value="Cyberpunk City">Cyberpunk City</option>
            <option value="Deep Space Station">Deep Space Station</option>
            <option value="Ancient Temple">Ancient Temple</option>
          </select>
        </div>
      </div>
      <div class="grid">
        <div class="form-group">
          <label>Tone</label>
          <select name="tone">
            <option value="Dramatic">Dramatic</option>
            <option value="Funny">Funny</option>
            <option value="Mysterious">Mysterious</option>
            <option value="Action-Packed">Action-Packed</option>
          </select>
        </div>
        <div class="form-group">
          <label>Art Style</label>
          <select name="style">
            <option value="Classic Comic Book">Classic Comic Book</option>
            <option value="Anime / Manga">Anime / Manga</option>
            <option value="Watercolor Fantasy">Watercolor Fantasy</option>
            <option value="Cyberpunk Vector">Cyberpunk Vector</option>
          </select>
        </div>
      </div>
      <button type="submit">Generate Comic Strip</button>
      <div id="loader" class="loader">Crafting your comic book... Please wait ~15-30 secs.</div>
    </form>
  </div>
</body>
</html>
