<!DOCTYPE html>
<html lang="en">
<head>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans',sans-serif; }

      min-height: 100vh; background: #0b0f19; color: white;
      display: flex; align-items: center; justify-content: center; padding: 2rem;

    .success-card {
      background: #1e293b; padding: 3rem; border-radius: 24px;
      text-align: center; max-width: 500px; border: 1px solid #334155;
    }
    .icon { font-size: 4rem; margin-bottom: 1rem; color: #10b981; }
    h1 { font-size: 1.8rem; margin-bottom: 0.8rem; }
    p { color: #94a3b8; margin-bottom: 2rem; line-height: 1.5; }
    a {
      padding: 0.8rem 1.8rem; background: #4f46e5; color: white;
      border-radius: 12px; text-decoration: none; font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="success-card">
    <div class="icon">&#10004;</div>
    <h1>Comic Exported Successfully!</h1>
    <p>Your comic book has been compiled into a high-quality PDF and downloaded. Ready to make another one?</p>
    <a href="/">Go Create Another Comic</a>

</html>
