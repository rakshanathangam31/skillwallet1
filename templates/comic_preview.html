<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comic Strip Preview</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; padding: 30px; margin: 0; }
        .container { max-width: 900px; margin: auto; }
        h1 { color: #38bdf8; text-align: center; }
        .panel-card { background: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 25px; border: 1px solid #334155; }
        .panel-title { font-size: 20px; font-weight: bold; color: #a855f7; margin-bottom: 10px; }
        .panel-desc { font-style: italic; color: #94a3b8; margin-bottom: 15px; }
        .panel-img { width: 100%; max-height: 400px; object-fit: contain; background: #000; border-radius: 8px; margin-bottom: 15px; }
        .panel-text { font-size: 16px; line-height: 1.6; background: #0f172a; padding: 15px; border-radius: 8px; }
        .actions { text-align: center; margin-top: 30px; display: flex; justify-content: center; gap: 15px; }
        .btn { background: #6366f1; color: white; padding: 12px 24px; text-decoration: none; border-radius: 8px; font-weight: bold; display: inline-block; transition: 0.2s; }
        .btn:hover { background: #4f46e5; }
        .btn-download { background: #10b981; }
        .btn-download:hover { background: #059669; }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ story_prompt }}</h1>
        <p style="text-align: center; color: #94a3b8;">Hero: {{ character_name }}</p>

        {% for p in layout %}
        <div class="panel-card">
            <div class="panel-title">{{ p.title }}</div>
            <div class="panel-desc">{{ p.scene_description }}</div>
            {% if p.image %}
            <img class="panel-img" src="{{ p.image }}" alt="Scene {{ p.panel }}">
            {% endif %}
            <div class="panel-text">{{ p.text }}</div>
        </div>
        {% endfor %}

        <!-- Download PDF மற்றும் Create Another பட்டன்கள் -->
        <div class="actions">
            <a href="/" class="btn">Create Another Comic</a>
            <a href="{{ pdf_path if pdf_path else '/static/exports/comic_story.pdf' }}" download="comic_story.pdf" class="btn btn-download">📥 Download PDF</a>
        </div>
    </div>
</body>
</html>
